name: v3.x - Publish Release (npm)

on:
  # Publishing a GitHub release is the normal path: the version comes from the
  # release tag and the dist-tag is derived from it.
  release:
    types: [published]

  # The manual path exists for the cases the release trigger cannot express --
  # chiefly promoting a prerelease to `latest`. A release event carries no
  # inputs, so re-running it would only derive the same tag again.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v3.0.0-beta.3"
        type: string
        required: true
      npm_dist_tag:
        description: "Dist-tag override. Leave blank to derive it from the version."
        type: string
        required: false

jobs:

  ##############################################################################
  # RELEASE VERSION CHECK
  ##############################################################################
  #
  # Sometimes we forget to update the `version` field in the `package.json`
  # file. It is intentional to manually update that file. As a result, we need
  # this workflow to check that we updated the version before releasing.
  #
  check_release_version:
    name: Check version in package.json

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CI_USER_PAT }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Perform version check
        run: |
          deno task check:package-json-version --version ${{ github.event.release.tag_name || github.event.inputs.version }}

  ##############################################################################
  # CODE QUALITY
  ##############################################################################

  check_file_headers:
    name: Check file headers
    needs: [check_release_version]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check file headers
        run: |
          deno task check:file-headers

  lint_code:
    name: Check for lint
    needs: [check_release_version]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno linter
        run: deno lint

  code_formatting:
    name: Check code formatting
    needs: [check_release_version]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno formatter check
        run: deno fmt --check

  ##############################################################################
  # PUBLISH TO REGISTRY
  ##############################################################################

  publish:
    name: Publish to registry (https://registry.npmjs.org)
    needs: [
      check_release_version,
      check_file_headers,
      lint_code,
      code_formatting,
    ]
    if: startsWith(github.event.release.tag_name || github.event.inputs.version, 'v3.')

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CI_USER_PAT }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node (latest)
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          scope: "@drashland"

      - name: Build Drash libs
        run: |
          npm install -g npm@latest
          pnpm install --frozen-lockfile && deno task build:libs

      # npm wants a dist-tag (`latest`, `beta`), not the release tag. The two
      # are derived from the same string but are not the same thing:
      #
      #   v3.0.0         -> latest
      #   v3.0.0-beta.3  -> beta
      #   v3.0.0-rc.1    -> rc
      #
      # This matters more than it looks. `npm publish` defaults to `latest`, so
      # without a dist-tag a prerelease becomes what `npm install @drashland/drash`
      # resolves to for everyone.
      #
      # The release tag is passed through `env` rather than interpolated into
      # the script body, so a tag name cannot inject shell.
      - name: Resolve npm dist-tag
        id: dist_tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.version }}
          NPM_DIST_TAG: ${{ github.event.inputs.npm_dist_tag }}
        run: |
          set -euo pipefail

          # An override wins outright. This is the path for promoting a
          # prerelease -- publishing v3.0.0-beta.3 under `latest` on purpose --
          # which derivation cannot express by design.
          if [[ -n "${NPM_DIST_TAG:-}" ]]; then
            # npm rejects a dist-tag that parses as a version, and the error it
            # gives is obscure. Catch the likely slip (pasting the version into
            # this box) here instead.
            if [[ "$NPM_DIST_TAG" =~ ^v?[0-9]+(\.[0-9]+)*([.-].*)?$ ]]; then
              echo "'${NPM_DIST_TAG}' looks like a version, not a dist-tag." >&2
              echo "npm rejects dist-tags that parse as versions." >&2
              exit 1
            fi

            echo "Overriding the derived dist-tag with '${NPM_DIST_TAG}'."
            echo "dist_tag=${NPM_DIST_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${RELEASE_TAG#v}"

          if [[ "$version" == *-* ]]; then
            # Everything after the first `-` is the prerelease, and its first
            # dot-separated identifier is the channel: `beta.3` -> `beta`.
            prerelease="${version#*-}"
            dist_tag="${prerelease%%.*}"
            # Drop any build metadata: `beta+2024` -> `beta`.
            dist_tag="${dist_tag%%+*}"
          else
            dist_tag="latest"
          fi

          # A malformed tag such as `v3.0.0-` yields an empty string, and
          # `npm publish --tag=` publishes to `latest`. Stop instead.
          if [[ -z "$dist_tag" ]]; then
            echo "Could not derive an npm dist-tag from '${RELEASE_TAG}'." >&2
            exit 1
          fi

          echo "Publishing ${RELEASE_TAG} under npm dist-tag '${dist_tag}'."
          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: |
          cd dist
          npm stage publish --access public --tag="${{ steps.dist_tag.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
