name: Docs

on:
  # Manual only, on purpose. A push to `main` can carry documentation for work
  # that is merged but not yet announced, and publishing is a one-way door: the
  # site is public the moment it deploys. Someone decides when the docs go out.
  #
  # This applies to the build as well as the deploy. The build uploads a Pages
  # artifact, and artifacts on a public repository are downloadable -- so
  # building on a pull request would put unreleased docs within reach even
  # though nothing was deployed.
  workflow_dispatch:

# Allow one concurrent deployment. A second run started while one is in flight
# cancels the first rather than racing it to the same Pages environment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Controls Next's `basePath`. Leave the variable unset for a custom
          # domain or an org page, where the site is served from the domain
          # root. Set it to "/drash" for a project page at
          # drashland.github.io/drash, so routes and assets under _next/
          # resolve against the subpath instead of the root.
          #
          # Set in Settings > Secrets and variables > Actions > Variables. An
          # unset variable expands to "", which is the root-served behaviour.
          DOCS_BASE_PATH: ${{ vars.DOCS_BASE_PATH }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  # No event guard here: `workflow_dispatch` is the only trigger, so every run
  # of this workflow is a deliberate request to publish.
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
