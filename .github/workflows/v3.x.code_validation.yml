name: v3.x - Code Validation

# Validation runs only when the library itself changes.
#
# `paths` is an allow-list: anything not matched below skips this workflow
# entirely. That is the point -- a docs or CI change cannot affect whether the
# library builds or passes -- but it cuts wider than it may look. A pull request
# touching only `tests/`, `deno.json`, `package.json`, or `scripts/doit.ts`
# (which `build:libs` runs) also skips validation, so those want a local
# `deno task test:all` before merging.
on:
  pull_request:
    branches:
      - v3.x
      - v3.x-beta
      - v3.x-staging
    paths:
      - "src/**"
  push:
    branches:
      - v3.x
      - v3.x-beta
      - v3.x-staging
    paths:
      - "src/**"

jobs:

  ##############################################################################
  # CODE QUALITY
  ##############################################################################
  check_file_headers:
    name: Check file headers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check file headers
        run: |
          deno task check:file-headers

  lint_code:
    name: Check for lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno linter
        run: deno lint

  code_formatting:
    name: Check code formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno formatter check
        run: deno fmt --check

  ##############################################################################
  # TESTS - COMPATIBILITY
  ##############################################################################

  tests_compat_bun:
    name: Compat - Bun
    needs: [check_file_headers, lint_code, code_formatting]

    strategy:
      matrix:
        # Add Windows when https://github.com/oven-sh/bun/issues/43 is complete
        os: [ubuntu-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x, 26.x]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno (for `deno` command)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash

      - name: Run Tests
        run: |
          deno task build:libs && ~/.bun/bin/bun test tests/compat/bun

  tests_compat_cloudflare:
    name: Compat - Cloudflare
    needs: [check_file_headers, lint_code, code_formatting]

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x, 26.x]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno (for `deno` command)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run Tests
        run: |
          deno task build:libs && deno task test:compat:cloudflare

  tests_compat_deno:
    name: Compat - Deno
    needs: [check_file_headers, lint_code, code_formatting]

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Tests
        run: |
          deno task test:compat:deno

      - name: Run Tests (Concurrency)
        run: |
          deno task test:compat:deno:concurrency

      - name: Run Tests (Middleware)
        run: |
          deno task test:middleware:deno

  tests_compat_node:
    name: Compat - Node
    needs: [check_file_headers, lint_code, code_formatting]

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x, 26.x]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno (for `deno` command)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run Tests
        run: |
          deno task build:libs && deno task test:compat:node

  ##############################################################################
  # TESTS - UNIT
  ##############################################################################

  tests_unit:
    name: Compat - Node
    needs: [check_file_headers, lint_code, code_formatting]

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x, 26.x]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno (for `deno` command)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Tests
        run: |
          deno task test:unit
