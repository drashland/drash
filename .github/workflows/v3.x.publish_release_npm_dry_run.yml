name: v3.x - Publish Release (npm - Dry Run)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v3.0.0-beta.3"
        type: string
        required: true
      npm_dist_tag:
        description: "Dist-tag override. Leave blank to derive it from the version."
        type: string
        required: false

jobs:

  ##############################################################################
  # RELEASE VERSION CHECK
  ##############################################################################
  #
  # Sometimes we forget to update the `version` field in the `package.json`
  # file. It is intentional to manually update that file. As a result, we need
  # this workflow to check that we updated the version before releasing.
  #
  check_release_version:
    name: Check version in package.json

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CI_USER_PAT }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Perform version check
        run: |
          deno task check:release-version-fields --version ${{ github.event.inputs.version }}

  ##############################################################################
  # CODE QUALITY
  ##############################################################################

  check_file_headers:
    name: Check file headers
    needs: [check_release_version]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check file headers
        run: |
          deno task check:file-headers

  lint_code:
    name: Check for lint
    needs: [check_release_version]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno linter
        run: deno lint

  code_formatting:
    name: Check code formatting
    needs: [check_release_version]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno formatter check
        run: deno fmt --check

  ##############################################################################
  # (DRY-RUN) PUBLISH TO REGISTRY
  ##############################################################################

  publish:
    name: (dry-run) Publish to registry (https://registry.npmjs.org)
    needs: [
      check_release_version,
      check_file_headers,
      lint_code,
      code_formatting,
    ]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CI_USER_PAT }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node (latest)
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          scope: "@drashland"

      - name: Build Drash libs
        run: |
          npm install -g npm@latest
          pnpm install --frozen-lockfile && deno task build:libs

      - name: (artifacts) Upload Drash libs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.inputs.version }}
          path: dist
          retention-days: 1

      # Mirrors the same step in v3.x.publish_release_npm.yml. Kept identical on
      # purpose: a dry run that resolves its dist-tag differently from the real
      # publish is not rehearsing the real publish.
      # Copied verbatim from v3.x.publish_release_npm.yml. A dry run that
      # resolves its dist-tag differently is not rehearsing the real publish.
      - name: Resolve npm dist-tag
        id: dist_tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.version }}
          NPM_DIST_TAG: ${{ github.event.inputs.npm_dist_tag }}
        run: |
          set -euo pipefail

          # An override wins outright. This is the path for promoting a
          # prerelease -- publishing v3.0.0-beta.3 under `latest` on purpose --
          # which derivation cannot express by design.
          if [[ -n "${NPM_DIST_TAG:-}" ]]; then
            # npm rejects a dist-tag that parses as a version, and the error it
            # gives is obscure. Catch the likely slip (pasting the version into
            # this box) here instead.
            if [[ "$NPM_DIST_TAG" =~ ^v?[0-9]+(\.[0-9]+)*([.-].*)?$ ]]; then
              echo "'${NPM_DIST_TAG}' looks like a version, not a dist-tag." >&2
              echo "npm rejects dist-tags that parse as versions." >&2
              exit 1
            fi

            echo "Overriding the derived dist-tag with '${NPM_DIST_TAG}'."
            echo "dist_tag=${NPM_DIST_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${RELEASE_TAG#v}"

          if [[ "$version" == *-* ]]; then
            # Everything after the first `-` is the prerelease, and its first
            # dot-separated identifier is the channel: `beta.3` -> `beta`.
            prerelease="${version#*-}"
            dist_tag="${prerelease%%.*}"
            # Drop any build metadata: `beta+2024` -> `beta`.
            dist_tag="${dist_tag%%+*}"
          else
            dist_tag="latest"
          fi

          # A malformed tag such as `v3.0.0-` yields an empty string, and
          # `npm publish --tag=` publishes to `latest`. Stop instead.
          if [[ -z "$dist_tag" ]]; then
            echo "Could not derive an npm dist-tag from '${RELEASE_TAG}'." >&2
            exit 1
          fi

          echo "Publishing ${RELEASE_TAG} under npm dist-tag '${dist_tag}'."
          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"

      - name: (dry-run) Publish
        run: |
          npm stage publish --access restricted --dry-run --tag="${{ steps.dist_tag.outputs.dist_tag }}"
