name: main - Code Validation

# Docs-only changes skip this workflow -- nothing under docs/ can affect the
# library. docs.yml is the mirror of this: it runs *only* on docs/**, so the two
# never both sit idle on a change. A commit touching docs/ *and* anything else
# still runs everything, because paths-ignore only skips when every changed file
# matches.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - "docs/**"

jobs:

  ##############################################################################
  # CODE QUALITY
  ##############################################################################
  check_file_headers:
    name: Check file headers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check file headers
        run: |
          deno task check:file-headers

  lint_code:
    name: Check for lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno linter
        run: deno lint

  code_formatting:
    name: Check code formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno formatter check
        run: deno fmt --check

  ##############################################################################
  # TESTS - COMPATIBILITY
  ##############################################################################

  tests_compat_bun:
    name: Compat - Bun
    needs: [check_file_headers, lint_code, code_formatting]

    strategy:
      matrix:
        # Add Windows when https://github.com/oven-sh/bun/issues/43 is complete
        os: [ubuntu-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x, 26.x]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno (for `deno` command)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash

      - name: Run Tests
        run: |
          deno task build:libs && ~/.bun/bin/bun test tests/compat/bun

  # tests_compat_cloudflare:
  #   name: Compat - Cloudflare
  #   needs: [check_file_headers, lint_code, code_formatting]

  #   strategy:
  #     matrix:
  #       os: [ubuntu-latest, windows-latest, macos-latest]
  #       node-version: [20.x, 22.x, 24.x, 26.x]
  #   runs-on: ${{ matrix.os }}

  #   steps:
  #     - uses: actions/checkout@v6

  #     - name: Install Deno (for `deno` command)
  #       uses: denoland/setup-deno@v2

  #     - name: Install Node ${{ matrix.node-version }}
  #       uses: actions/setup-node@v7
  #       with:
  #         node-version: ${{ matrix.node-version }}

  #     - name: Install Node dependencies
  #       run: |
  #         pnpm install --frozen-lockfile

  #     - name: Run Tests
  #       run: |
  #         deno task build:libs && deno task test:compat:cloudflare

  tests_compat_deno:
    name: Compat - Deno
    needs: [check_file_headers, lint_code, code_formatting]

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Tests
        run: |
          deno task test:compat:deno

      - name: Run Tests (Concurrency)
        run: |
          deno task test:compat:deno:concurrency

      - name: Run Tests (Middleware)
        run: |
          deno task test:middleware:deno

  tests_compat_node:
    name: Compat - Node
    needs: [check_file_headers, lint_code, code_formatting]

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x, 26.x]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno (for `deno` command)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run Tests
        run: |
          deno task build:libs && deno task test:compat:node

  ##############################################################################
  # TESTS - UNIT
  ##############################################################################

  tests_unit:
    name: Compat - Node
    needs: [check_file_headers, lint_code, code_formatting]

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x, 26.x]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Deno (for `deno` command)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Tests
        run: |
          deno task test:unit
