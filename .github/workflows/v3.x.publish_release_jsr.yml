name: v3.x - Publish Release (JSR)

on:
  # Publishing a GitHub release is the normal path: the version comes from the
  # release tag, and `deno publish` reads it from deno.json -- which
  # `check:package-json-version` has already compared against that tag.
  release:
    types: [published]

  # The manual path exists for re-running a publish that failed after the
  # release was already created. A release event carries no inputs, so the
  # version has to be supplied here.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v3.0.0"
        type: string
        required: true

jobs:

  ##############################################################################
  # RELEASE VERSION CHECK
  ##############################################################################
  #
  # JSR takes its version from the `version` field in deno.json, not from the
  # release tag. This check fails the release when the two disagree, which is
  # the same reason the npm workflow runs it -- both files are updated by hand.
  #
  check_release_version:
    name: Check version in deno.json and package.json

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.version }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Perform version check
        run: |
          deno task check:package-json-version --version ${{ github.event.release.tag_name || github.event.inputs.version }}

  ##############################################################################
  # CODE QUALITY
  ##############################################################################

  check_file_headers:
    name: Check file headers
    needs: [check_release_version]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.version }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check file headers
        run: |
          deno task check:file-headers

  lint_code:
    name: Check for lint
    needs: [check_release_version]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.version }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Declaring `name` and `exports` in deno.json makes this a JSR package,
      # which turns on the JSR lint rules -- `no-slow-types` in particular.
      # Those are the same diagnostics `deno publish` refuses on, so catching
      # them here fails the release before anything is uploaded.
      - name: Run Deno linter
        run: deno lint

  code_formatting:
    name: Check code formatting
    needs: [check_release_version]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.version }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno formatter check
        run: deno fmt --check

  ##############################################################################
  # JSR EXPORTS CHECK
  ##############################################################################
  #
  # deno.json's `exports` map is generated from `src` by ./scripts/doit.ts.
  # A stale map publishes a package that silently cannot import whatever was
  # added, and JSR versions are immutable -- so the only fix would be another
  # release. Catch it here instead.
  #
  jsr_exports_up_to_date:
    name: Check JSR exports are up to date
    needs: [check_release_version]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.version }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Regenerate JSR exports
        run: |
          deno run --allow-read --allow-write --allow-net ./scripts/doit.ts

      - name: Fail if deno.json is stale
        run: |
          git diff --exit-code deno.json \
            || (echo "::error::deno.json exports are stale. Run 'deno task build:libs' and commit deno.json." && exit 1)

  ##############################################################################
  # PUBLISH TO REGISTRY
  ##############################################################################

  publish:
    name: Publish to registry (https://jsr.io)
    needs: [
      check_release_version,
      check_file_headers,
      lint_code,
      code_formatting,
      jsr_exports_up_to_date,
    ]
    if: startsWith(github.event.release.tag_name || github.event.inputs.version, 'v3.')

    runs-on: ubuntu-latest

    # No token is stored for JSR. @drashland/drash is linked to this repo, so
    # `deno publish` authenticates over OIDC using the short-lived credential
    # `id-token: write` grants. Both permissions are required: setting any
    # `permissions` block drops every default, so `contents: read` has to be
    # restated for the checkout to work.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.version }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # JSR publishes the TypeScript in `src` directly, so there is no build
      # step here -- unlike the npm workflow, which publishes tsup's output.
      #
      # No `--allow-slow-types`: the public API carries explicit types, which is
      # what lets JSR generate .d.ts for Node consumers. If that flag ever looks
      # necessary, the fix is to annotate the API rather than to pass it.
      #
      # No `--allow-dirty` either. `deno publish` refuses a dirty tree, and that
      # check is worth keeping: it means the published source matches the tag.
      - name: Publish package
        run: deno publish
